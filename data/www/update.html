<!doctype html>
<html>
<head>
    <title>Firmware OTA &mdash; PU3IKE</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <script src="js/jquery-3.5.1.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body, body.light {
            --bg:#f0f2f5; --panel:#fff; --text:#212529; --muted:#6c757d;
            --accent:#0b5ed7; --accent-dim:#e8f0fe; --border:#dee2e6;
            --header-bg:#0b5ed7; --header-text:#fff;
        }
        body.dark {
            --bg:#0a0a0a; --panel:#141414; --text:#e07b00; --muted:#555;
            --accent:#e07b00; --accent-dim:#1a1200; --border:#252525;
            --header-bg:#0a0a0a; --header-text:#e07b00;
        }
        body { background:var(--bg); color:var(--text); transition:background .2s,color .2s; }
        .r-header { background:var(--header-bg); color:var(--header-text); padding:10px 16px;
            display:flex; align-items:center; justify-content:space-between;
            border-bottom:2px solid var(--accent); }
        .r-header h5 { margin:0; font-size:.95rem; font-weight:700; }
        .r-header a { color:var(--header-text); text-decoration:none; padding:3px 9px;
            border:1px solid var(--header-text); border-radius:4px; font-size:.78rem; opacity:.75; }
        .r-header a:hover { opacity:1; }
        .theme-btn { background:transparent; border:1px solid var(--header-text);
            color:var(--header-text); padding:3px 9px; border-radius:4px; cursor:pointer; font-size:.78rem; }
        .r-card { background:var(--panel); border:1px solid var(--border); border-radius:8px;
            padding:20px; max-width:460px; margin:16px auto; }
        .r-card-header { background:var(--accent-dim); border-bottom:1px solid var(--border);
            border-radius:6px 6px 0 0; margin:-20px -20px 16px -20px; padding:8px 16px;
            font-size:.72rem; font-weight:700; text-transform:uppercase;
            letter-spacing:.1em; color:var(--accent); }
        .form-control { background:var(--bg)!important; color:var(--text)!important;
            border-color:var(--border)!important; }
        label { font-size:.82rem; color:var(--muted); display:block; margin-bottom:3px; }
        .btn-upload { width:100%; padding:10px; color:#fff; border:none;
            border-radius:5px; font-weight:700; cursor:pointer; font-size:.9rem; }
        .btn-fw   { background:#c0392b; }
        .btn-fs   { background:#1a6b3c; }
        .btn-upload:disabled { opacity:.55; cursor:not-allowed; }
        .btn-upload:hover:not(:disabled) { filter:brightness(1.1); }
        .path-hint { font-size:.75rem; color:var(--muted); margin-top:6px; font-family:monospace; }
    </style>
</head>
<body>

<div class="r-header">
    <h5>&#8593; OTA Update &mdash; PU3IKE</h5>
    <div style="display:flex;gap:7px;align-items:center;">
        <a href="/">&#8962; Controle</a>
        <a href="/setup.html">&#9881; Setup</a>
        <button class="theme-btn" onclick="toggleTheme()">&#9728; / &#9790;</button>
    </div>
</div>

<div style="padding:0 10px;">

    <!-- Firmware -->
    <div class="r-card">
        <div class="r-card-header">&#9881; Firmware</div>
        <p style="font-size:.85rem;">Atualiza o programa principal do ESP32.</p>
        <div class="mb-3">
            <label>Arquivo <code>.bin</code> de firmware</label>
            <input type="file" class="form-control form-control-sm" id="fw_file" accept=".bin">
            <div class="path-hint">.pio/build/esp32doit-devkit-v1/firmware.bin</div>
        </div>
        <div class="progress mb-3" id="fw_progress_bar" style="display:none;">
            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 id="fw_progress" role="progressbar" style="width:0%">0%</div>
        </div>
        <div id="fw_status" class="mb-2"></div>
        <button class="btn-upload btn-fw" id="fw_btn">Enviar Firmware</button>
    </div>

    <!-- SPIFFS -->
    <div class="r-card">
        <div class="r-card-header">&#128193; Filesystem (SPIFFS)</div>
        <p style="font-size:.85rem;">Atualiza as p&aacute;ginas web e arquivos est&aacute;ticos.</p>
        <div class="mb-3">
            <label>Arquivo <code>.bin</code> do filesystem</label>
            <input type="file" class="form-control form-control-sm" id="fs_file" accept=".bin">
            <div class="path-hint">.pio/build/esp32doit-devkit-v1/spiffs.bin</div>
        </div>
        <div class="progress mb-3" id="fs_progress_bar" style="display:none;">
            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 id="fs_progress" role="progressbar" style="width:0%">0%</div>
        </div>
        <div id="fs_status" class="mb-2"></div>
        <button class="btn-upload btn-fs" id="fs_btn">Enviar SPIFFS</button>
    </div>

</div>

<script>
    function applyTheme(t) {
        document.body.classList.toggle('dark', t === 'dark');
        localStorage.setItem('theme', t);
    }
    function toggleTheme() {
        applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
    }
    applyTheme(localStorage.getItem('theme') || 'light');

    function doUpload(fileId, endpoint, progressBarId, progressId, statusId, btnId) {
        var file = $(fileId)[0].files[0];
        if (!file) { alert('Selecione um arquivo .bin primeiro.'); return; }
        var formData = new FormData();
        formData.append('file', file);
        $(progressBarId).show();
        $(btnId).prop('disabled', true);
        $(statusId).html('');
        $.ajax({
            url: endpoint, type: 'POST', data: formData, processData: false, contentType: false,
            xhr: function() {
                var xhr = new XMLHttpRequest();
                xhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) {
                        var p = Math.round(e.loaded / e.total * 100);
                        $(progressId).css('width', p + '%').text(p + '%');
                    }
                });
                return xhr;
            },
            success: function(r) {
                $(statusId).html('<div class="alert alert-success">' + r + '</div>');
                setTimeout(function(){ window.location.href = '/'; }, 5000);
            },
            error: function() {
                $(statusId).html('<div class="alert alert-danger">Falha no upload.</div>');
                $(btnId).prop('disabled', false);
            }
        });
    }

    $('#fw_btn').on('click', function() {
        doUpload('#fw_file', '/update',    '#fw_progress_bar', '#fw_progress', '#fw_status', '#fw_btn');
    });
    $('#fs_btn').on('click', function() {
        doUpload('#fs_file', '/update-fs', '#fs_progress_bar', '#fs_progress', '#fs_status', '#fs_btn');
    });
</script>
</body>
</html>
