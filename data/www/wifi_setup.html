<!DOCTYPE html>
<html>
<head>
    <title>Configuracao Wi-Fi do Rotor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>
<body>
    <div class="border border-primary m-3 bg-white rounded">
        <div class="row m-1">
            <div class="col text-center">
                <h3>Configurar Wi-Fi do Rotor</h3>
            </div>
        </div>
        <div class="p-3">
            <div class="form-group">
                <label for="ssid">Rede Wi-Fi (SSID):</label>
                <input type="text" class="form-control" id="ssid" name="ssid"
                       placeholder="Nome da rede" autocomplete="off"
                       onkeydown="return event.key !== 'Enter';">
            </div>
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Senha da rede" autocomplete="off"
                       onkeydown="return event.key !== 'Enter';">
            </div>
            <div id="status" class="mb-2"></div>
            <button type="button" class="btn btn-primary btn-block" onclick="salvar()">Salvar e Reiniciar</button>
            <hr>
            <div class="alert alert-info mt-2" role="alert">
                Apos salvar, o dispositivo ira reiniciar. Conecte-se a sua rede Wi-Fi normal e acesse o rotor pelo seu novo IP ou pelo endereco .local configurado.
            </div>
        </div>
    </div>
    <script src="js/jquery-3.5.1.min.js"></script>
    <script src="js/bootstrap.js"></script>
    <script>
    function salvar() {
        var ssid = document.getElementById('ssid').value.trim();
        var password = document.getElementById('password').value;
        if (!ssid) {
            document.getElementById('status').innerHTML = '<div class="alert alert-warning">Digite o nome da rede.</div>';
            return;
        }
        document.getElementById('status').innerHTML = '<div class="alert alert-info">Salvando...</div>';
        var formData = new FormData();
        formData.append('ssid', ssid);
        formData.append('password', password);
        fetch('/save', { method: 'POST', body: formData })
            .then(function(r) { return r.text(); })
            .then(function(t) {
                document.getElementById('status').innerHTML = '<div class="alert alert-success">' + t + '</div>';
            })
            .catch(function() {
                document.getElementById('status').innerHTML = '<div class="alert alert-danger">Erro ao salvar.</div>';
            });
    }
    </script>
</body>
</html>
